  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #ddc80b;
    margin: 0;
    padding: 10px; /* Padding para móviles */
    display: flex;
    justify-content: center;
  }
  .container {
    width: 100%;
    max-width: 600px; /* Tamaño máximo para escritorio */
    background: #2a00e7;
    padding: 10px;
    border-radius: 15px;
    box-shadow: 0 4px 6px rgba(12, 212, 136, 0.603);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  img {
    width: 100%;
    height: auto; /* Mantiene la proporción */
    max-height: 250px;
    object-fit: contain; /* Evita que la imagen se deforme */
    border-radius: 10px;
    margin: 15px 0;
    background: #d61313; /* Fondo blanco para las velas si la imagen es transparente */
  }
  button {
    width: 100%; /* Botones ocupan todo el ancho en móviles */
    padding: 5px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #2563eb;
    color: white;
    font-size: 18px;
    transition: background 0.2s;
  }
  button:active { transform: scale(0.98); }
  .opciones-container {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin: 20px 0;
  }
  h1 { font-size: 1.5rem; }
  #timer { font-size: 20px; color: #fbbf24; }
</style>

let indice = 0;
let score = 0;
let preguntasHechas = 0;
let tiempoRestante = 0;
let timerInterval = null;
let patronActual = null;

function obtenerPatronAleatorio() {
  return patrones[Math.floor(Math.random() * patrones.length)];
}

function iniciarTemporizador() {
  tiempoRestante = 15;
  actualizarTemporizador();
  
  timerInterval = setInterval(() => {
    tiempoRestante--;
    actualizarTemporizador();
    
    if (tiempoRestante <= 0) {
      clearInterval(timerInterval);
      document.getElementById("resultado").textContent = "⏰ Tiempo agotado. Era: " + patronActual.correcto;
      deshabilitarBotones();
      preguntasHechas++;
      
      if (preguntasHechas < 100) {
        setTimeout(cargarPatron, 2000);
      } else {
        mostrarFinal();
      }
    }
  }, 1500);
}

function actualizarTemporizador() {
  document.getElementById("timer").textContent = `Tiempo: ${tiempoRestante}s`;
  if (tiempoRestante <= 3) {
    document.getElementById("timer").style.color = "#ef4444";
  } else {
    document.getElementById("timer").style.color = "#fbbf24";
  }
}

function deshabilitarBotones() {
  const botones = document.querySelectorAll(".opciones-container button");
  botones.forEach(btn => btn.disabled = true);
}

function cargarPatron() {
  clearInterval(timerInterval);
  
  const p = obtenerPatronAleatorio();
  patronActual = p;
  document.getElementById("imagen").src = p.img;
  document.getElementById("pregunta").textContent = p.pregunta;
  document.getElementById("preguntaActual").textContent = preguntasHechas + 1;
  const opcionesDiv = document.getElementById("opciones");
  opcionesDiv.innerHTML = "";
  document.getElementById("resultado").textContent = "";

  p.opciones.forEach(op => {
    const btn = document.createElement("button");
    btn.textContent = op;
    btn.onclick = () => verificar(op);
    btn.disabled = false;
    opcionesDiv.appendChild(btn);
  });
  
  iniciarTemporizador();
}

function verificar(respuesta) {
  clearInterval(timerInterval);
  deshabilitarBotones();
  
  const resultado = document.getElementById("resultado");

  if (respuesta === patronActual.correcto) {
    resultado.textContent = "✅ Correcto!";
    score++;
    document.getElementById("score").textContent = score;


    // --- NUEVA LÓGICA DE VICTORIA ---
    if (score === 50) {
      mostrarVictoria();
      return; // Salimos para no seguir con la siguiente pregunta
    }


  } else {
    resultado.textContent = "❌ Incorrecto. Era: " + patronActual.correcto;
  }

  preguntasHechas++;
  
  if (preguntasHechas < 100) {
    setTimeout(cargarPatron, 2000);
  } else {
    mostrarFinal();
  }
}


function mostrarVictoria() {
  const anim = document.getElementById("animacionVictoria");
  anim.style.display = "block";
  
  // Esperar 6 segundos y reiniciar
  setTimeout(() => {
    anim.style.display = "none";
    reiniciarJuego();
  }, 6000);
}

function mostrarFinal() {
  setTimeout(() => {
    document.getElementById("resultado").textContent = `🎉 ¡Juego terminado! Puntaje final: ${score}/100`;
    document.getElementById("reinicioContainer").style.display = "block";
    document.getElementById("imagen").style.display = "none";
    document.getElementById("pregunta").style.display = "none";
    document.getElementById("opciones").style.display = "none";
    document.getElementById("timer").style.display = "none";
  }, 500);
}

function reiniciarJuego() {
  indice = 0;
  score = 0;
  preguntasHechas = 0;
  tiempoRestante = 0;
  clearInterval(timerInterval);
  
  document.getElementById("score").textContent = "0";
  document.getElementById("preguntaActual").textContent = "1";
  document.getElementById("resultado").textContent = "";
  document.getElementById("imagen").style.display = "block";
  document.getElementById("pregunta").style.display = "block";
  document.getElementById("opciones").style.display = "flex";
  document.getElementById("timer").style.display = "block";
  document.getElementById("reinicioContainer").style.display = "none";
  
  cargarPatron();
}

cargarPatron();
