<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: #fff;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Timer bar top ── */
#timer {
  background: #1e293b;
  padding: 12px 24px;
  font-size: 22px;
  font-weight: bold;
  color: #ef4444;
  text-align: center;
  flex-shrink: 0;
}

/* ── Two-column layout ── */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* Left: chart */
.chart-panel {
  flex: 1 1 65%;
  padding: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.chart-panel img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 8px;
  border: 2px solid #334155;
  background: #fff;
}

/* Right: controls */
.right-panel {
  flex: 0 0 320px;
  display: flex;
  flex-direction: column;
  padding: 16px 16px 16px 0;
  gap: 10px;
}

#pregunta {
  font-size: 17px;
  font-weight: bold;
  background: #1e293b;
  border-radius: 8px;
  padding: 14px 16px;
  min-height: 52px;
}

.opciones-container {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.opciones-container button {
  width: 100%;
  padding: 13px 16px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  background: #2563eb;
  color: #fff;
  font-size: 15px;
  text-align: left;
  transition: background 0.15s;
}

.opciones-container button:hover:not(:disabled) { background: #1d4ed8; }
.opciones-container button:disabled { background: #475569; cursor: not-allowed; }

#resultado {
  font-size: 15px;
  min-height: 22px;
  padding: 0 4px;
}

#reinicioContainer button {
  width: 100%;
  padding: 12px;
  background: #10b981;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
}
#reinicioContainer button:hover { background: #059669; }

/* Info card at bottom */
.info-card {
  margin-top: auto;
  background: #1e293b;
  border-radius: 10px;
  padding: 18px 16px;
  text-align: center;
}
.info-card h2 { font-size: 22px; font-weight: bold; margin-bottom: 6px; line-height: 1.3; }
.info-card p { font-size: 14px; color: #94a3b8; }
.info-card p span.hl { color: #fbbf24; font-weight: bold; }
</style>
</head>

<body>
  <div id="timer">Tiempo: 15s</div>

let indice = 0;
let score = 0;
let preguntasHechas = 0;
let tiempoRestante = 0;
let timerInterval = null;
let patronActual = null;

function obtenerPatronAleatorio() {
  return patrones[Math.floor(Math.random() * patrones.length)];
}

function iniciarTemporizador() {
  tiempoRestante = 15;
  actualizarTemporizador();
  
  timerInterval = setInterval(() => {
    tiempoRestante--;
    actualizarTemporizador();
    
    if (tiempoRestante <= 0) {
      clearInterval(timerInterval);
      document.getElementById("resultado").textContent = "⏰ Tiempo agotado. Era: " + patronActual.correcto;
      deshabilitarBotones();
      preguntasHechas++;
      
      if (preguntasHechas < 100) {
        setTimeout(cargarPatron, 2000);
      } else {
        mostrarFinal();
      }
    }
  }, 1500);
}

function actualizarTemporizador() {
  document.getElementById("timer").textContent = `Tiempo: ${tiempoRestante}s`;
  if (tiempoRestante <= 3) {
    document.getElementById("timer").style.color = "#ef4444";
  } else {
    document.getElementById("timer").style.color = "#fbbf24";
  }
}

function deshabilitarBotones() {
  const botones = document.querySelectorAll(".opciones-container button");
  botones.forEach(btn => btn.disabled = true);
}

function cargarPatron() {
  clearInterval(timerInterval);
  
  const p = obtenerPatronAleatorio();
  patronActual = p;
  document.getElementById("imagen").src = p.img;
  document.getElementById("pregunta").textContent = p.pregunta;
  document.getElementById("preguntaActual").textContent = preguntasHechas + 1;
  const opcionesDiv = document.getElementById("opciones");
  opcionesDiv.innerHTML = "";
  document.getElementById("resultado").textContent = "";

  p.opciones.forEach(op => {
    const btn = document.createElement("button");
    btn.textContent = op;
    btn.onclick = () => verificar(op);
    btn.disabled = false;
    opcionesDiv.appendChild(btn);
  });
  
  iniciarTemporizador();
}

function verificar(respuesta) {
  clearInterval(timerInterval);
  deshabilitarBotones();
  
  const resultado = document.getElementById("resultado");

  if (respuesta === patronActual.correcto) {
    resultado.textContent = "✅ Correcto!";
    score++;
    document.getElementById("score").textContent = score;


    // --- NUEVA LÓGICA DE VICTORIA ---
    if (score === 50) {
      mostrarVictoria();
      return; // Salimos para no seguir con la siguiente pregunta
    }


  } else {
    resultado.textContent = "❌ Incorrecto. Era: " + patronActual.correcto;
  }

  preguntasHechas++;
  
  if (preguntasHechas < 100) {
    setTimeout(cargarPatron, 2000);
  } else {
    mostrarFinal();
  }
}


function mostrarVictoria() {
  const anim = document.getElementById("animacionVictoria");
  anim.style.display = "block";
  
  // Esperar 6 segundos y reiniciar
  setTimeout(() => {
    anim.style.display = "none";
    reiniciarJuego();
  }, 6000);
}

function mostrarFinal() {
  setTimeout(() => {
    document.getElementById("resultado").textContent = `🎉 ¡Juego terminado! Puntaje final: ${score}/100`;
    document.getElementById("reinicioContainer").style.display = "block";
    document.getElementById("imagen").style.display = "none";
    document.getElementById("pregunta").style.display = "none";
    document.getElementById("opciones").style.display = "none";
    document.getElementById("timer").style.display = "none";
  }, 500);
}

function reiniciarJuego() {
  indice = 0;
  score = 0;
  preguntasHechas = 0;
  tiempoRestante = 0;
  clearInterval(timerInterval);
  
  document.getElementById("score").textContent = "0";
  document.getElementById("preguntaActual").textContent = "1";
  document.getElementById("resultado").textContent = "";
  document.getElementById("imagen").style.display = "block";
  document.getElementById("pregunta").style.display = "block";
  document.getElementById("opciones").style.display = "flex";
  document.getElementById("timer").style.display = "block";
  document.getElementById("reinicioContainer").style.display = "none";
  
  cargarPatron();
}

cargarPatron();
